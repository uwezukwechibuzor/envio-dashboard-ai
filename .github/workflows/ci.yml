name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -r typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm test

  mcp-protocol:
    name: MCP protocol tests
    runs-on: ubuntu-latest
    env:
      ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm --filter @envio-dashboard-ai/mcp-server test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter './packages/*' build

      - name: Install Playwright browsers
        run: pnpm --filter @envio-dashboard-ai/web exec playwright install chromium --with-deps

      - name: Build web app
        run: pnpm --filter @envio-dashboard-ai/web build
        env:
          ENVIO_API_TOKEN: mock
          ANTHROPIC_API_KEY: mock
          DATABASE_URL: mock
          AUTH_SECRET: test-secret-32-chars-xxxxxxxxxx
          AUTH_GITHUB_ID: mock
          AUTH_GITHUB_SECRET: mock
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Playwright tests
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t envio-mcp:ci .
